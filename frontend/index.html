<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sweet Home & Boutique CR | Ilumina tu hogar y tu estilo</title>
    <meta name="description" content="Tienda en línea exclusiva en Costa Rica. Hogar, moda, perfumería, belleza, cuidado personal y detalles únicos con envíos a todo el país y pagos seguros por SINPE Móvil." />
    
    <!-- Preconnect a CDNs requeridos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- Preload del Logo Oficial de la Marca para evitar parpadeos en recarga -->
    <link rel="preload" as="image" href="/images/logo_thumb.webp" type="image/webp" fetchpriority="high" />

    <!-- Preload del Banner Principal del Hero (LCP) con soporte responsivo -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=1920&q=80"
      imagesrcset="https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=800&q=80 800w, https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=1920&q=80 1920w"
      imagesizes="(max-width: 640px) 100vw, 1920px"
      fetchpriority="high"
    />

    <!-- Fuentes Asíncronas No Bloqueantes con font-display: swap -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" />
    </noscript>
  </head>
  <body class="bg-night-900 text-text-primary antialiased selection:bg-gold-base/30 selection:text-gold-light min-h-screen">
    <div id="root">
      <!-- Shell visual inicial que coincide exactamente con el Header real de React -->
      <div style="background-color: #0E051C; min-height: 100vh;">
        <!-- 1. Promo bar superior (34px) -->
        <div style="height: 34px; background: rgba(10, 4, 20, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 11px; color: #E0CEAA;">
          <span>✨ Envíos a todo Costa Rica por Correos de CR y Mensajería Express GAM</span>
          <span style="color: #64D2FF;">Rastreo de Pedido</span>
        </div>
        <!-- 2. Barra Principal con Logo (64px) en posición 100% idéntica a React -->
        <header style="height: 64px; background: rgba(14, 5, 28, 0.95); border-bottom: 1px solid rgba(212, 175, 55, 0.15); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-sizing: border-box;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(212, 175, 55, 0.45); overflow: hidden; background: #12071F; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);">
              <img src="/images/logo_thumb.webp" alt="Sweet Home & Boutique CR" width="44" height="44" style="width: 100%; height: 100%; object-fit: cover;" />
            </div>
            <div style="display: flex; flex-direction: column;">
              <span style="font-family: 'Great Vibes', cursive; color: #F2C14E; font-size: 26px; line-height: 1.1;">Sweet Home</span>
              <span style="font-family: 'Cormorant Garamond', Georgia, serif; color: #E0CEAA; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; font-weight: 600;">& BOUTIQUE CR</span>
            </div>
          </div>
        </header>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
